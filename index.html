    <span class="hk">${i + 1}</span><div class="ic">${ic}</div><div class="nm">${nm}</div><div class="rr">${rr2}</div><div class="ds">${ds}</div>${ev ? `<div class="ev">${ev}</div>` : ''}
    ${price !== undefined ? `<div class="pr">${o.sold ? '已售出' : price + ' 🪙'}</div>` : ''}</div>`;
}
function openLevelUp(done) {
  state = 'ui'; boosting = false; sfx.level();
  lvCtx = { done, opts: rollLevelOpts(3 + meta('choice')) };
  renderLevelUp();
}
function renderLevelUp() {
  show(`<h2 style="color:#7df9ff">⬆️ 升级！ Lv ${R.level - R.pendingLv + 1}</h2><div class="sub">${R.pendingLv > 1 ? `还有 ${R.pendingLv - 1} 次升级待选择 · ` : ''}按 1-${lvCtx.opts.length} 快速选择</div>
    <div class="cards">${lvCtx.opts.map((o, i) => optCard(o, i)).join('')}</div>
    <button class="alt" data-act="lvReroll" ${R.gold >= 10 ? '' : 'disabled'}>🎲 刷新 (10🪙)</button>`);
}
handlers.lvPick = i => {
  const o = lvCtx.opts[+i]; if (!o) return;
  if (o.k === 'perk') addPerk(o.id); else if (o.k === 'wup') { R.weapons[o.i].lv++; checkEvolve(); } else giveWeapon(o.id, 1);
  R.pendingLv--; sfx.pick();
  const done = lvCtx.done;
  if (R.pendingLv > 0) { lvCtx.opts = rollLevelOpts(3 + meta('choice')); renderLevelUp(); } else done();
};
handlers.lvReroll = () => { if (R.gold < 10) return; R.gold -= 10; lvCtx.opts = rollLevelOpts(lvCtx.opts.length); renderLevelUp(); };

// ---------- 波次结束 ----------
function afterWave() {
  state = 'ui';
  if (R.pendingLv > 0) return openLevelUp(afterWave);
  const wasBoss = isBossWave(R.wave);
  R.wave++;
  if (wasBoss) {
    R.hp = R.st.maxHp;
    if (R.wave === CAMPAIGN && !R.endless) return showVictory();
    return showRelicPick('👑 首领的遗物', newChapter);
  }
  beginRest();
}
function showVictory() {
  save.stats.wins++; persist();
  show(`<h1>🏆 远征胜利！</h1><div class="sub" style="font-size:16px">你击败了全部 4 位首领，成为传说中的霓虹武装之蛇！</div>
    <div class="stats"><span>☠ 击杀 ${R.kills}</span><span>⭐ 等级 ${R.level}</span><span>🧬 究极武器 ${R.weapons.filter(w => WEAPONS[w.id].evo).length}</span></div>
    <div class="cards">
      <div class="card" data-act="settle" data-hot="1" style="border-color:#7df9ff;color:#7df9ff;width:230px"><span class="hk">1</span><div class="ic">💎</div><div class="nm">结算远征</div><div class="ds">领取蛇魂，返回进化树进行局外升级</div></div>
      <div class="card evo" data-act="endless" data-hot="2" style="border-color:#ffd60a;color:#ffd60a;width:230px"><span class="hk">2</span><div class="ic">♾️</div><div class="nm">进入无尽模式</div><div class="ds">敌人与首领一波比一波强。每坚持一波都能获得额外蛇魂，死亡时一并结算。</div></div>
    </div>`);
}
handlers.settle = () => runEnd(true);
handlers.endless = () => { R.endless = true; showRelicPick('♾️ 无尽的开端', newChapter); };
function newChapter() {
  buildMap(themeOf(R.wave)); makeSnake(10, 32); computeSegPos(1);
  crates = []; apples = []; gems = []; mines = []; zones = []; portals = []; altars = [];
  beginRest();
  showBanner(R.wave >= CAMPAIGN ? `♾️ 无尽 · ${M.theme.name}` : `第 ${Math.floor(R.wave / WAVES_PER_CH) + 1} 章 · ${M.theme.name}`, M.theme.wall);
}
function showRelicPick(title, done) {
  const opts = []; for (let i = 0; i < 3; i++) { const id = rollPerk(0, 3, opts) || rollPerk(0, 2, opts) || rollPerk(0, 0, opts); if (id) opts.push(id); }
  if (!opts.length) { R.gold += 80; return done(); }
  show(`<h2 style="color:#ffd60a">${title}</h2><div class="sub">选择一件遗物</div>
    <div class="cards">${opts.map((id, i) => { const p = PERKS[id], c = RAR[p.r]; return `<div class="card" data-act="relic" data-arg="${id}" data-hot="${i + 1}" style="border-color:${c.color};color:${c.color}">
      <span class="hk">${i + 1}</span><div class="ic">${p.icon}</div><div class="nm">${p.name}</div><div class="rr">${c.name}</div><div class="ds">${p.desc}</div></div>`; }).join('')}</div>`);
  handlers.relic = id => { addPerk(id); sfx.pick(); done(); };
}

// ---------- 补给站 ----------
const PERK_PRICE = [16, 32, 58, 110];
function shopPrice(o) { const m = 1 + R.wave * .1; return o.k === 'perk' ? Math.round(PERK_PRICE[PERKS[o.id].r] * m) : Math.round((20 + 10 * (o.lv - 1)) * m); }
function rollShop() {
  const out = [];
  // 引导：若能凑成进化，优先上架搭档武器
  const need = EVOS.filter(ev => !R.weapons.some(w => w.id === ev.to) && R.weapons.some(w => w.id === ev.a) && !R.weapons.some(w => w.id === ev.b) && R.weapons.length < R.st.slots);
  if (need.length && Math.random() < .6) out.push({ k: 'weapon', id: pick(need).b, lv: 1 });
  while (out.length < 5) {
    if (Math.random() < .5) out.push({ k: 'weapon', id: pick(availBase()), lv: Math.random() < .12 + R.wave * .03 ? 2 : 1 });
    else { const id = rollPerk(.6, 0, out.filter(o => o.k === 'perk').map(o => o.id)); if (id) out.push({ k: 'perk', id }); }
  }
  return out;
}
function showShop() {
  state = 'ui'; boosting = false;
  if (!WV.shop) { WV.shop = rollShop(); WV.freeRerolls = meta('reroll'); WV.rerolls = 0; }
  renderShop();
}
function shopCard(o, i) {
  const price = shopPrice(o);
  if (o.k === 'perk') return optCard(o, i, price);
  const D = WEAPONS[o.id], own = R.weapons.find(w => w.id === o.id);
  const full = !own && R.weapons.length >= R.st.slots, maxed = own && own.lv >= 5;
  const evo = own && willEvolve(o.id, own.lv + o.lv);
  const ev2 = !own && EVOS.find(e => e.b === o.id && R.weapons.some(w => w.id === e.a && w.lv >= 5));
  const note = own ? (maxed ? '已满级' : `升级 Lv${own.lv} → ${Math.min(5, own.lv + o.lv)}`) : full ? '⚠️ 槽位已满' : '✨ 新武器';
  const evTxt = evo ? `⚡ 购买后进化为 ${WEAPONS[evo.to].icon} ${WEAPONS[evo.to].name}！` : ev2 ? `⚡ 购买后 ${WEAPONS[ev2.a].icon} 立即进化为 ${WEAPONS[ev2.to].icon} ${WEAPONS[ev2.to].name}！` : evoHint(o.id);
  return `<div class="card ${evo || ev2 ? 'evo' : ''} ${o.sold || maxed || full ? 'off' : ''}" data-act="shopBuy" data-arg="${i}" data-hot="${i + 1}" style="border-color:${D.color};color:${D.color}">
    <span class="hk">${i + 1}</span><div class="ic">${D.icon}</div><div class="nm">${D.name} Lv${o.lv}</div><div class="rr">${note}</div><div class="ds">${D.desc}</div><div class="ev">${evTxt}</div>
    <div class="pr">${o.sold ? '已售出' : price + ' 🪙'}</div></div>`;
}
const sellPrice = w => WEAPONS[w.id].evo ? 0 : Math.round((8 + 8 * (w.lv - 1)) * (1 + R.wave * .08));
function renderShop() {
  const rc = WV.freeRerolls > 0 ? 0 : 5 + WV.rerolls * 3, healC = Math.round(12 + R.wave * 2.5);
  const wl = R.weapons.map((w, i) => { const D = WEAPONS[w.id]; return `<div class="wl" style="border-color:${D.evo ? '#ffd60a' : D.color}"><div class="i">${D.icon}</div><b style="color:${D.color}">${D.name}</b><div>${D.evo ? '🧬 究极' : 'Lv' + w.lv}</div>
    ${D.evo ? '' : `<div class="ev">${evoHint(w.id)}</div><button class="sm alt" data-act="sell" data-arg="${i}" ${R.weapons.length <= 1 ? 'disabled' : ''}>出售 +${sellPrice(w)}🪙</button>`}</div>`; }).join('');
  const perks = Object.entries(R.perks).filter(([, c]) => c > 0).map(([id, c]) => `<span class="tag" title="${PERKS[id].desc}" style="border:1px solid ${RAR[PERKS[id].r].color}">${PERKS[id].icon} ${PERKS[id].name}${c > 1 ? '×' + c : ''}</span>`).join('');
  show(`<h2 style="color:#7dff9a">🛒 补给站</h2>
    <div class="sub">下一波：${waveLabel(R.wave)}${isBossWave(R.wave) ? ' 👑 首领战' : ''} · <span class="goldt">🪙 ${R.gold}</span> · ❤️ ${Math.ceil(R.hp)}/${R.st.maxHp} · Lv ${R.level} · 🌟 ${Math.floor(R.ult)}%</div>
    <div class="cards">${WV.shop.map((o, i) => shopCard(o, i)).join('')}</div>
    <button class="alt" data-act="reroll" ${R.gold >= rc ? '' : 'disabled'}>🎲 刷新 ${rc ? `(${rc}🪙)` : `(免费×${WV.freeRerolls})`}</button>
    <button class="alt" data-act="healBuy" ${R.gold >= healC && R.hp < R.st.maxHp ? '' : 'disabled'}>💖 回复 40% 生命 (${healC}🪙)</button>
    <button class="alt" data-act="ultBuy" ${R.gold >= 40 + R.wave * 4 && R.ult < 100 ? '' : 'disabled'}>🌟 大招能量 +20% (${40 + R.wave * 4}🪙)</button>
    <h3>我的武器 ${R.weapons.length}/${R.st.slots}</h3><div class="wlist">${wl}</div>
    ${perks ? `<h3>祝福</h3><div>${perks}</div>` : ''}
    <div style="margin-top:14px"><button data-act="nextWave" data-primary>⚔️ 开始下一波 (空格)</button><button class="alt" data-act="leaveShop">🗺️ 返回地图</button><button class="alt" data-act="codex2">📖 图鉴</button></div>`);
}
handlers.shopBuy = i => {
  const o = WV.shop[+i]; if (!o || o.sold) return;
  const price = shopPrice(o); if (R.gold < price) return;
  if (o.k === 'perk') addPerk(o.id);
  else { const r = giveWeapon(o.id, o.lv); if (r === 'full' || r === 'max') return; }
  R.gold -= price; o.sold = true; sfx.buy(); renderShop();
};
handlers.reroll = () => { const rc = WV.freeRerolls > 0 ? 0 : 5 + WV.rerolls * 3; if (R.gold < rc) return;
  if (WV.freeRerolls > 0) WV.freeRerolls--; else { R.gold -= rc; WV.rerolls++; } WV.shop = rollShop(); renderShop(); };
handlers.healBuy = () => { const c = Math.round(12 + R.wave * 2.5); if (R.gold < c) return; R.gold -= c; R.hp = Math.min(R.st.maxHp, R.hp + R.st.maxHp * .4); sfx.buy(); renderShop(); };
handlers.ultBuy = () => { const c = 40 + R.wave * 4; if (R.gold < c) return; R.gold -= c; R.ult = Math.min(100, R.ult + 20); sfx.buy(); renderShop(); };
handlers.sell = i => { if (R.weapons.length <= 1) return; const w = R.weapons.splice(+i, 1)[0]; reslot(); R.gold += sellPrice(w); sfx.coin(); renderShop(); };
handlers.nextWave = () => showWaveIntro();
handlers.leaveShop = () => resumePlay();
handlers.codex2 = () => show(`<h2 style="color:#ffd60a">📖 究极进化图鉴</h2>${codexHTML()}<button data-act="backShop" data-primary>返回补给站</button>`);
handlers.backShop = () => renderShop();

// ---------- 暂停 ----------
function togglePause() {
  if (state === 'play') {
    state = 'pause'; boosting = false;
    const wl = R.weapons.map(w => { const D = WEAPONS[w.id]; return `<div class="wl" style="border-color:${D.evo ? '#ffd60a' : D.color}"><div class="i">${D.icon}</div><b style="color:${D.color}">${D.name}</b><div>${D.evo ? '🧬 究极' : 'Lv' + w.lv}</div><div style="opacity:.7">伤害 ${Math.round(wDmg(w))}</div>${D.evo ? '' : `<div class="ev">${evoHint(w.id)}</div>`}</div>`; }).join('');
    const perks = Object.entries(R.perks).filter(([, c]) => c > 0).map(([id, c]) => `<div class="mi" style="border-color:${RAR[PERKS[id].r].color}"><b>${PERKS[id].icon} ${PERKS[id].name}${c > 1 ? ' ×' + c : ''}</b><div style="opacity:.75">${PERKS[id].desc}</div></div>`).join('');
    const st = R.st;
    show(`<h2>⏸ 暂停</h2><div class="sub">波次 ${waveLabel(R.wave)} · Lv ${R.level} · 🪙 ${R.gold} · 🌟 大招 ${Math.floor(R.ult)}%（${CHARS[R.char].ult.name}）</div>
      <div class="stats"><span>伤害 ×${dmgMul().toFixed(2)}</span><span>射速 ×${st.rate.toFixed(2)}</span><span>射程 ×${st.range.toFixed(2)}</span><span>暴击 ${Math.round(st.crit * 100)}%</span><span>护甲 ${st.armor}</span><span>拾取 ${st.magnet.toFixed(1)}</span><span>移速 ×${st.speed.toFixed(2)}</span></div>
      <div class="wlist">${wl}</div>${perks ? `<div class="grid">${perks}</div>` : ''}
      <button data-act="resume" data-primary>继续</button><button class="alt" data-act="codex">📖 图鉴</button><button class="alt" data-act="abandon">放弃远征</button>`);
  } else if (state === 'pause') { hide(); state = 'play'; last = performance.now(); }
  updateNextBtn();
}
handlers.resume = togglePause;
handlers.abandon = () => runEnd(R.wave >= CAMPAIGN);

// ---------- 结算 ----------
function runEnd(win) {
  state = 'ui'; PK = null; stash = null; cutins = []; curCut = null;
  let souls = R.wavesCleared * 4 + R.bosses * 30 + Math.floor(R.kills / 40) + (win ? 120 : 0) + R.endlessCleared * 10;
  souls = Math.round(souls * (1 + .2 * meta('soul')));
  save.souls += souls; save.stats.kills += R.kills; save.stats.endless = Math.max(save.stats.endless, R.endlessCleared); persist();
  const wl = R.weapons.map(w => `${WEAPONS[w.id].icon}<sub>${WEAPONS[w.id].evo ? 'EVO' : w.lv}</sub>`).join(' ');
  const pk = Object.entries(R.perks).filter(([, c]) => c > 0).map(([id, c]) => PERKS[id].icon + (c > 1 ? '×' + c : '')).join(' ');
  show(`<h2 style="color:${win ? '#ffd60a' : '#ff006e'}">${R.endlessCleared ? `♾️ 无尽模式坚持了 ${R.endlessCleared} 波` : win ? '🏆 远征胜利！' : '💀 远征失败'}</h2>
    <div class="sub">${win ? '传说中的霓虹武装之蛇！' : `倒在了波次 ${waveLabel(R.wave)}`}</div>
    <div class="big souls">+${souls} 💎</div>
    <div class="stats"><span>✅ 完成波次 ${R.wavesCleared}</span><span>👑 首领 ${R.bosses}</span><span>☠ 击杀 ${R.kills}</span><span>⭐ 等级 ${R.level}</span><span>🌟 大招 ${R.ults} 次</span><span>🪙 总金币 ${R.goldEarned}</span></div>
    <div style="font-size:22px;margin:6px 0">${wl}</div><div style="font-size:18px;margin-bottom:14px">${pk}</div>
    <button data-act="metaShop" data-primary>🧬 进化树 (💎${save.souls})</button><button class="alt" data-act="startRun">再来一局</button><button class="alt" data-act="menu">主菜单</button>`);
}

/* ======================= 输入 ======================= */
function turn(x, y) {
  if (state !== 'play') return;
  const ld = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
  if ((x === ld.x && y === ld.y) || (x === -ld.x && y === -ld.y)) return;
  // 即时转向：不必等到下一格才生效
  if (!S.queue.length && S.prev.length > 1 && !S.inst) {
    const iv = stepInterval(), t = S.acc / iv, p0 = S.prev[0], p1 = S.prev[1];
    const pd = { x: p0.x - p1.x, y: p0.y - p1.y }, okPd = Math.abs(pd.x) + Math.abs(pd.y) === 1;
    if (t < .5 && okPd && !(x === -pd.x && y === -pd.y)) {
      // 本格刚开始移动：回退到上一格，直接朝新方向走（视觉上头部立即拐弯）
      S.snake = S.prev.map(p => ({ x: p.x, y: p.y })); S.dir = { x, y }; S.inst = true;
      step(); if (state === 'play') computeSegPos(clamp(S.acc / iv, 0, 1)); return;
    }
    if (t >= .3) {
      // 本格已走一半：立刻进入下一格并转向
      S.queue.push({ x, y }); S.acc = 0; S.inst = true; step(); if (state === 'play') computeSegPos(0); return;
    }
  }
  if (S.queue.length < 3) S.queue.push({ x, y });
}
function startNextFromRest() { if (state === 'play' && WV && WV.phase === 'rest' && !PK) { boosting = false; showWaveIntro(); } }
const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
document.addEventListener('keydown', e => {
  if (KEYS[e.code] || e.code === 'Space') e.preventDefault();
  if (state === 'play' && KEYS[e.code]) { turn(...KEYS[e.code]); return; }
  if (e.code === 'KeyM') { toggleSound(); return; }
  if ((e.code === 'KeyE' || e.code === 'KeyQ') && state === 'play') { tryUlt(); return; }
  if (e.code === 'KeyN') { startNextFromRest(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play' || state === 'pause') togglePause(); return; }
  if (e.code === 'Space' && state === 'play') { boosting = true; return; }
  if (!overlay.classList.contains('hidden') && !e.repeat) {
    if (e.code === 'Space' || e.code === 'Enter') { const b = overlay.querySelector('[data-primary]:not([disabled])'); if (b) b.click(); }
    const m = e.code.match(/^(?:Digit|Numpad)(\d)$/);
    if (m) { const el = overlay.querySelector(`[data-hot="${m[1]}"]:not([disabled]):not(.off)`); if (el) el.click(); }
  }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') boosting = false; });
window.addEventListener('blur', () => { boosting = false; if (state === 'play') togglePause(); });
let tStart = null;
cvs.addEventListener('touchstart', e => { const t = e.touches[0]; tStart = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
cvs.addEventListener('touchmove', e => { if (!tStart) return; const t = e.touches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) { if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy)); tStart = { x: t.clientX, y: t.clientY }; }
  e.preventDefault(); }, { passive: false });
cvs.addEventListener('touchend', () => tStart = null);
$('boostBtn').addEventListener('touchstart', e => { e.preventDefault(); if (state === 'play') boosting = true; }, { passive: false });
$('boostBtn').addEventListener('touchend', e => { e.preventDefault(); boosting = false; });
$('ultBtn').addEventListener('touchstart', e => { e.preventDefault(); tryUlt(); }, { passive: false });
$('nextBtn').onclick = e => { startNextFromRest(); e.currentTarget.blur(); };
function toggleSound() { save.sound = !save.sound; persist(); $('soundBtn').textContent = save.sound ? '🔊' : '🔇'; }
$('soundBtn').onclick = e => { toggleSound(); e.currentTarget.blur(); };
$('pauseBtn').onclick = e => { if (state === 'play' || state === 'pause') togglePause(); e.currentTarget.blur(); };
$('soundBtn').textContent = save.sound ? '🔊' : '🔇';

function resize() {
  W = window.innerWidth; H = window.innerHeight; DPR = window.devicePixelRatio || 1;
  cvs.width = W * DPR; cvs.height = H * DPR; cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  CELL = clamp(Math.round(Math.min(W, H) / 24), 18, 30);
}
window.addEventListener('resize', resize);
resize(); showMenu();
requestAnimationFrame(loop);
window.__NS = { handlers, get: () => ({ state, R, S, WV, M, PK, enemies, bullets, portals }), setBoost: v => boosting = v, turn, tryUlt, startNextFromRest, showShop: () => showShop(), enterPocket: t => enterPocket({ x: 0, y: 0, type: t }), giveWeapon, checkEvolve };
})();
</script>
